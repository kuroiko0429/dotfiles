include ~/.config/kitty/gruvbox_dark.conf

# Transparency & Blur
background_opacity 0.85
background_blur 1

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Font
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

# Cursor
cursor_shape beam
cursor_trail 1
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0

# Mouse
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Window
remember_window_size yes
draw_minimal_borders yes
window_border_width 1pt
window_margin_width 2
window_padding_width 4
active_border_color #fe8019
inactive_border_color #665c54
inactive_text_alpha 0.7
placement_strategy center

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
active_tab_foreground   #282828
active_tab_background   #fe8019
inactive_tab_foreground #ebdbb2
inactive_tab_background #3c3836
tab_bar_background      #282828

# Shell
shell zsh
confirm_os_window_close 0
update_check_interval 0
term xterm-kitty

# Remote control (for search kitten)
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# タブが1枚のときはタブバーを隠す（tmux使用時など）
tab_bar_min_tabs 2

# --- Keybindings ---

# Copy / Paste
map ctrl+c        copy_or_interrupt
map kitty_mod+v   paste_from_clipboard
map shift+insert  paste_from_selection

# Font size
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Scroll
map page_up         scroll_page_up
map page_down       scroll_page_down
map kitty_mod+up    scroll_line_up
map kitty_mod+down  scroll_line_down
map kitty_mod+home  scroll_home
map kitty_mod+end   scroll_end
map kitty_mod+g     show_scrollback

# Search
map ctrl+f      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Window splits
map kitty_mod+\     launch --location=vsplit --cwd=current
map kitty_mod+-     launch --location=hsplit --cwd=current
map kitty_mod+enter new_window_with_cwd
map kitty_mod+w     close_window
map kitty_mod+]     next_window
map kitty_mod+[     previous_window
map kitty_mod+r     start_resizing_window
map kitty_mod+z     toggle_layout stack

# Tabs
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+q     close_tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+l     next_tab
map kitty_mod+h     previous_tab
map kitty_mod+1     goto_tab 1
map kitty_mod+2     goto_tab 2
map kitty_mod+3     goto_tab 3
map kitty_mod+4     goto_tab 4
map kitty_mod+5     goto_tab 5
