# ==========================================
# プレフィックスキー
# ==========================================
unbind C-b
set -g prefix C-z
bind C-z send-prefix

# ==========================================
# 基本設定
# ==========================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-kitty:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setal=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g extended-keys on
set -g focus-events on
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 1500
set -g display-panes-time 2000
set -g set-clipboard on
set -g clock-mode-style 24
# イメージプロトコル対応 (Kitty/foot等)
set -g allow-passthrough on

set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g extended-keys-format csi-u

# ==========================================
# 見た目 (Gruvbox)
# ==========================================
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour214,bold

set -g popup-border-lines rounded
set -g popup-border-style fg=colour214

set -g message-style bg=colour214,fg=colour235,bold
set -g message-command-style bg=colour237,fg=colour223

set -g mode-style bg=colour214,fg=colour235,bold

# ==========================================
# コピーモード (vi)
# ==========================================
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi ^   send -X back-to-indentation
bind -T copy-mode-vi \$  send -X end-of-line
bind -T copy-mode-vi K   send -X scroll-up
bind -T copy-mode-vi J   send -X scroll-down

# ==========================================
# ペイン操作
# ========================================== 
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind x kill-pane

# ==========================================
# ウィンドウ操作
# ==========================================
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

bind M select-layout main-horizontal
bind V select-layout even-horizontal
bind T select-layout tiled

# ==========================================
# キーバインド
# ==========================================
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# プロジェクトディレクトリからセッション作成/切替
bind f display-popup -E "tmux-sessionizer"

# フローティング各種ユーティリティ
bind g display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"
bind ! display-popup -E -w 90% -h 90% "htop"
bind G display-popup -E -w 95% -h 95% "lazygit"
bind N display-popup -E -w 80% -h 80% "ncdu ~"
bind D display-popup -E -w 95% -h 95% "lazydocker"
bind I display-popup -E -w 85% -h 85% "~/Documents/hypr/hypr-info"
# manページをfzfで検索してポップアップ表示
bind m display-popup -E -w 80% -h 80% "man \$(man -k . | fzf --prompt='man: ' | awk '{print \$1}') 2>/dev/null || exit 0"

# 全ペイン同期トグル
bind e setw synchronize-panes \; display "Sync: #{?pane_synchronized,ON,OFF}"

# 直前のウィンドウ/セッションに戻る
bind Tab last-window
bind '`' switch-client -l

# ペインをウィンドウに切り出す / 吸収する
bind b break-pane -d
bind B command-prompt -p "join pane from window:" "join-pane -s '%%'"

# ==========================================
# ネストしたtmux対応 — F12でプレフィックスをOFF/ON
# SSHした先でもtmuxを使うときに外側を無効化できる
# ==========================================
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style bg=colour237,fg=colour239 \;\
    set window-status-current-format "#[fg=colour239,bg=colour237]  #I #W  " \;\
    set window-status-format "#[fg=colour239,bg=default]  #I #W  " \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-format \;\
    set -u window-status-format \;\
    refresh-client -S

# ==========================================
# ステータスバー (Gruvbox)
# ==========================================
set -g status-interval 30   # hypr-ws daemon が即時更新するので短くする必要なし
set -g status-justify left
set -g status-style bg=default,fg=colour246

set -g status-left-length 80
set -g status-left "#[bg=colour214,fg=colour235,bold] #S #[bg=default,fg=colour214,nobold]  #[fg=colour239]│#[fg=default]  #(~/Documents/hypr/hypr-ws)  #[fg=colour239]│ "

set -g window-status-format "#[fg=colour246,bg=default]  #I #W  "
set -g window-status-current-format "#[fg=colour223,bg=colour237,bold]  #I #W  "
set -g window-status-activity-style fg=colour108,bg=default,bold

set -g status-right-length 150
set -g status-right "#{prefix_highlight}#{pomodoro_status}  #[fg=colour208]#{claude_usage} #[fg=colour142]#{battery_percentage} #[fg=colour108]↓#{download_speed} #[fg=colour167]↑#{upload_speed} #[fg=colour246]CPU:#{cpu_percentage} %H:%M #[fg=colour239]| #[fg=colour223,bold]#H "

# ==========================================
# tmux-prefix-highlight (Gruvbox)
# ==========================================
set -g @prefix_highlight_fg 'colour235'
set -g @prefix_highlight_bg 'colour214'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=colour235,bg=colour108,bold'
set -g @prefix_highlight_prefix_prompt 'WAIT'
set -g @prefix_highlight_copy_prompt 'COPY'

# ==========================================
# tmux-yank (Wayland / wl-copy)
# ==========================================
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# ==========================================
# tmux-resurrect — セッション保存・復元
# ==========================================
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh lazygit btop'

# ==========================================
# tmux-continuum
# ==========================================
set -g @continuum-restore 'off'

# ==========================================
# tmux-sessionx (prefix + O)
# ==========================================
set -g @sessionx-bind 'O'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '60%'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '70%'

# ==========================================
# tmux-fzf-url (prefix + u)
# ==========================================
set -g @fzf-url-bind 'u'
set -g @fzf-url-open 'xdg-open'

# ==========================================
# tmux-thumbs (prefix + F)
# ==========================================
set -g @thumbs-key 'F'

# ==========================================
# tmux-fzf (prefix + Z) — fzfでtmux操作全般
# ==========================================
set -g @tmux-fzf-launch-key 'Z'
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'wl-copy {} && tmux set-buffer {}'

# ==========================================
# tmux-open (コピーモード内 o / S)
# ==========================================
set -g @open-S 'https://duckduckgo.com/?q='

# ==========================================
# tmux-fuzzback — スクロールバッファをfzf検索 (prefix + /)
# ==========================================
set -g @fuzzback-bind '/'
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'

# ==========================================
# tmux-logging
# ==========================================
set -g @logging-path "$HOME/logs/tmux"

# ==========================================
# tmux-better-mouse-mode
# ==========================================
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# ==========================================
# tmux-autoreload
# ==========================================
set -g @autoreload 'on'

# ==========================================
# tmux-menus — 右クリックでコンテキストメニュー (prefix + \)
# ==========================================
set -g @menus_trigger '\'

# ==========================================
# tmux-notify — コマンド完了をデスクトップ通知 (10秒以上かかったもの)
# ==========================================
set -g @tnotify-sleep-duration '10'
set -g @tnotify-prompt-suffixes ';#;$;%;>;|'

# ==========================================
# tmux-pomodoro-plus — ポモドーロタイマー
# prefix + y: 開始/一時停止  (p=前ウィンドウ、P=logging と被るため)
# prefix + Y: キャンセル
# ==========================================
set -g @pomodoro_mins 25
set -g @pomodoro_break_mins 5
set -g @pomodoro_start 'y'
set -g @pomodoro_cancel 'Y'
set -g @pomodoro_on "#[fg=colour167]POMO "
set -g @pomodoro_complete "#[fg=colour142]DONE "
set -g @pomodoro_pause "#[fg=colour214]PAUSE "
set -g @pomodoro_prompt_break "#[fg=colour108]break? "
set -g @pomodoro_prompt_pomodoro "#[fg=colour214]start? "
set -g @pomodoro_interval_display "#[fg=colour246][%s/%s]"

# ==========================================
# tmux-net-speed
# ==========================================
set -g @net_speed_interfaces "wlan0"
set -g @download_speed_format "%10s"
set -g @upload_speed_format "%10s"

# ==========================================
# プラグイン (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'ChanderG/tmux-notify'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'docker-run/tmux-claude-usage'

run '~/.config/tmux/plugins/tpm/tpm'
